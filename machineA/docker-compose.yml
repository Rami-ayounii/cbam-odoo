services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: machineA-tailscale
    hostname: cbam-machineA
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: machineA-ollama
    network_mode: service:tailscale
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    # GPU support — uncomment if NVIDIA GPU is present and nvidia-container-toolkit is installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  nginx:
    image: nginx:latest
    container_name: machineA-nginx
    network_mode: service:tailscale
    environment:
      # Required so the image's built-in envsubst-on-templates entrypoint
      # (docker-entrypoint.d/20-envsubst-on-templates.sh) can substitute
      # ${OLLAMA_API_KEY} in nginx.conf.template. That script only expands
      # variables that are actually present in the container's environment;
      # without this, ${OLLAMA_API_KEY} is left as a literal, undefined
      # nginx variable reference and nginx fails to start.
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - ollama
      - tailscale
    restart: unless-stopped
    # nginx listens on port 8443 (TLS termination handled at the tailscale/firewall layer;
    # nginx itself listens plain HTTP on 8443 — acceptable on a private tailnet)

volumes:
  tailscale-state:
  ollama-models:
