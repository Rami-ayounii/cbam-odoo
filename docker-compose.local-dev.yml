# LOCAL-DEV / SINGLE-MACHINE STACK - NOT THE REAL DEPLOYMENT TOPOLOGY.
#
# The real architecture is two machines joined over Tailscale - see
# machineA/docker-compose.yml and machineB/docker-compose.yml. This file
# exists purely so M3 (Odoo module install)/M6 (agent loop)/M9 (evaluation)
# can be exercised against real Odoo + real Ollama on a single host, when a
# second machine isn't reachable. No Tailscale anywhere here: every service
# talks to every other one directly by Docker Compose service name on one
# bridge network. nginx.conf.template is reused byte-for-byte from
# machineA/ so the real API-key gate logic is still genuinely verified, even
# though it isn't running behind the real Tailscale sidecar here.
#
# nginx/ollama networking note: machineA/nginx.conf.template hardcodes
# `proxy_pass http://127.0.0.1:11434` because in the real topology nginx and
# ollama both join `network_mode: service:tailscale` and therefore share one
# network namespace/loopback. Since this file is required to reuse that
# template unmodified, the nginx service below reproduces the same
# mechanism by joining `network_mode: "service:ollama"` instead of a
# tailscale sidecar - nginx's 127.0.0.1:11434 then really is ollama's
# listener. One consequence: nginx has no network identity of its own once
# it borrows ollama's namespace, so port 8443 is published on the `ollama`
# service below, and any other container that needs to reach the gate must
# address it as `ollama:8443` (not `nginx:8443`).
#
# Usage: docker compose -f docker-compose.local-dev.yml --env-file .env.local-dev up -d

services:

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-models-local-dev:/root/.ollama
    ports:
      # Published here, not on nginx: nginx shares this container's network
      # namespace (see nginx service below), so 8443 (nginx's listener) is
      # reachable through the network namespace ollama owns.
      - "8443:8443"
    networks: [local-dev]
    # GPU support - keep uncommented only if Task 1's
    # `docker run --rm --gpus all ...` check succeeded on this host:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:latest
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - ./machineA/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [ollama]
    # Shares ollama's network namespace so nginx.conf.template's
    # `proxy_pass http://127.0.0.1:11434` (unmodified, byte-for-byte from
    # machineA/) actually reaches ollama's listener - see header comment.
    # network_mode is mutually exclusive with `networks:`/`ports:`, so
    # neither is set here.
    network_mode: "service:ollama"

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data-local-dev:/var/lib/postgresql/data
    networks: [local-dev]

  odoo:
    image: odoo:17
    depends_on: [db]
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - odoo-data-local-dev:/var/lib/odoo
      - ./machineB/addons:/mnt/extra-addons:ro
    ports:
      - "8069:8069"
    networks: [local-dev]

  orchestrator:
    build:
      context: .
      dockerfile: machineB/orchestrator/Dockerfile
    depends_on: [odoo, nginx]
    environment:
      # Address the gate as `ollama:8443`, not `nginx:8443` - see header
      # comment: nginx has no network identity of its own once it joins
      # ollama's network namespace.
      - OLLAMA_BASE_URL=http://ollama:8443
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=${ODOO_DB:-cbam}
      - ODOO_USER=${ODOO_USER:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - LLM_MODEL=${LLM_MODEL}
      - MAX_AGENT_ITERATIONS=${MAX_AGENT_ITERATIONS:-9}
      - TOOL_SCHEMA_DIR=/app/shared/tool_schemas
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY}
    ports:
      - "8000:8000"
    networks: [local-dev]

volumes:
  ollama-models-local-dev:
  postgres-data-local-dev:
  odoo-data-local-dev:

networks:
  local-dev:
    driver: bridge
