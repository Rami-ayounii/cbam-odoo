services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: machineB-tailscale
    hostname: cbam-machineB
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    # Also join "internal": odoo and orchestrator use
    # `network_mode: service:tailscale`, meaning they run inside this
    # container's network namespace instead of getting their own. Docker's
    # embedded DNS only resolves a service name (e.g. "db") for containers
    # that share a network with that service. Without this, "db" is
    # unresolvable from odoo/orchestrator and Odoo cannot reach Postgres.
    networks:
      - default
      - internal

  db:
    image: postgres:16
    container_name: machineB-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    # Postgres listens only on the internal Docker bridge — not exposed on tailnet
    networks:
      - internal

  odoo:
    image: odoo:17
    container_name: machineB-odoo
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
    # Odoo listens on port 8069; share the tailscale network so it is reachable
    # on the tailnet at cbam-machineB:8069 (adjust ACLs as needed for dev access)
    network_mode: service:tailscale
    restart: unless-stopped

  orchestrator:
    build:
      context: ..
      dockerfile: machineB/orchestrator/Dockerfile
    container_name: machineB-orchestrator
    depends_on:
      - odoo
      - tailscale
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}       # e.g. http://<machineA-tailscale-ip>:8443
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - ODOO_URL=http://127.0.0.1:8069
      - ODOO_DB=${ODOO_DB:-cbam}
      - ODOO_USER=${ODOO_USER:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b-instruct}
      - MAX_AGENT_ITERATIONS=${MAX_AGENT_ITERATIONS:-9}
      - TOOL_SCHEMA_DIR=/app/shared/tool_schemas
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY}
    network_mode: service:tailscale
    restart: unless-stopped
    # M6: agent loop built in machineB/orchestrator/. Build context is the
    # repo root (not machineB/) so the Dockerfile can also COPY
    # shared/tool_schemas/ - those schemas live outside machineB/ and would
    # be unreachable by a machineB/-scoped build context.

volumes:
  tailscale-state:
  postgres-data:
  odoo-data:

networks:
  internal:
    driver: bridge
